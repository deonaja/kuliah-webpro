<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bermain dengan Warna</title>
    <link rel="stylesheet" href="style2.css" />
    <!-- IMPORT CDN DISINI -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <h1>Bermain dengan Warna</h1>

    <div>
      <button id="tombolMerah">Merah</button>
      <button id="tombolBiru">Biru</button>
      <button id="tombolKuning">Kuning</button>
    </div>

    <div id="kotakWarna"></div>

    <div>
      <button id="sembunyikanKotak">Sembunyikan Kotak</button>
      <button id="tampilkanKotak">Tampilkan Kotak</button>
    </div>

    <p>Klik tombol warna untuk mengubah warna kotak.</p>
    <p>
      Gunakan tombol Sembunyikan dan Tampilkan untuk menyembunyikan dan
      menampilkan kotak.
    </p>

    <script>
      //code disini.. pastikan menggunakan JQUERY
      $(document).ready(function () {
        const $kotak = $("#kotakWarna");
        const $btnMerah = $("#tombolMerah");
        const $btnBiru = $("#tombolBiru");
        const $btnKuning = $("#tombolKuning");
        const $btnHide = $("#sembunyikanKotak");
        const $btnShow = $("#tampilkanKotak");

        $btnMerah.click(function () {
          $kotak.css("background-color", "red");
        });

        $btnBiru.click(function () {
          $kotak.css("background-color", "blue");
        });

        $btnKuning.click(function () {
          $kotak.css("background-color", "yellow");
        });

        $btnHide.click(function () {
          $kotak.hide();
        });

        $btnShow.click(function () {
          $kotak.show();
        });
      });
    </script>
  </body>
</html>
